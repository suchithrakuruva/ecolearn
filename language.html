<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Language | EcoLearn</title>
    <meta name="description" content="Choose your preferred language for the EcoLearn platform." />
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <a href="index.html"><button class="btn sm" style="margin-bottom:16px;">⬅ Back to Hub</button></a>

        <div class="section-heading">🌐 Language Settings</div>
        <p style="color:var(--green3);font-size:0.93rem;margin-bottom:24px;">
            Choose the language you'd like to use in EcoLearn. More languages are being added! 🌍
        </p>

        <div class="grid-3" id="lang-grid">
            <div style="color:var(--green4);">Loading languages…</div>
        </div>

        <hr class="eco" />

        <div
            style="background:linear-gradient(135deg,var(--bg3),var(--bg4));border-radius:14px;padding:18px 22px;border:1px solid var(--green1);">
            <div style="font-weight:700;color:var(--green5);font-size:0.98rem;">
                🌐 Currently Selected: <strong style="color:var(--green2);" id="current-lang">English</strong>
            </div>
            <div style="font-size:0.83rem;color:var(--green3);margin-top:6px;">
                The platform will use this language for all content, lessons and notifications.
                Translations are AI-assisted and improve over time. 💚
            </div>
        </div>

        <hr class="eco" />
        <div id="footer"></div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="app.js"></script>
    <script>initLanguage();</script>
</body>

</html>
